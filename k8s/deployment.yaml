apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-analyzer
  labels:
    app: nlp-analyzer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nlp-analyzer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nlp-analyzer
    spec:
      containers:
      - name: nlp-analyzer
        image: ${DOCKER_REGISTRY}/nlp-analyzer:${IMAGE_TAG}
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: nlp-analyzer-secrets
              key: database-url
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: nlp-analyzer-secrets
              key: session-secret
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
      imagePullSecrets:
      - name: docker-registry-secret