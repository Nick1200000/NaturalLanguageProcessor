apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nlp-analyzer-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - nlp-analyzer.example.com
    secretName: nlp-analyzer-tls
  rules:
  - host: nlp-analyzer.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nlp-analyzer
            port:
              number: 80