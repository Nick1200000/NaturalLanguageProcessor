<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <meta name="description" content="NLP Text Analyzer - Natural Language Processing tool for text analysis, sentiment, entities, and more.">
    <meta name="keywords" content="NLP, text analysis, sentiment analysis, natural language processing, entity recognition">
    <meta name="author" content="NLP Text Analyzer">
    <title>NLP Text Analyzer</title>
    
    <!-- Bootstrap CSS (Replit Theme) -->
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-brain me-2 text-info"></i>
                <span class="fw-bold">NLP</span> Text Analyzer
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">
                            <i class="fas fa-home me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://github.com" target="_blank" rel="noopener noreferrer">
                            <i class="fab fa-github me-1"></i> GitHub
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="https://github.com" target="_blank" rel="noopener noreferrer">
                            <i class="fas fa-book me-1"></i> Docs
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-3">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <h5><i class="fas fa-brain text-info me-2"></i> NLP Text Analyzer</h5>
                    <p class="text-muted small">
                        A powerful tool for analyzing text using Natural Language Processing techniques.
                    </p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <p>
                        <span class="me-3"><i class="fas fa-flask text-info me-1"></i> Flask</span>
                        <span class="me-3"><i class="fas fa-brain text-info me-1"></i> NLTK</span>
                        <span><i class="fas fa-chart-bar text-info me-1"></i> Chart.js</span>
                    </p>
                    <p class="text-muted small">© 2025 NLP Text Analyzer</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    {% block scripts %}{% endblock %}
</body>
</html>
